<!DOCTYPE html>
<html>
    <head>
       <title>Registration</title>
    </head>
    <body>
        <center>
        <h1>NPTEL Course Registration Portal</h1>
        <h3>“Upgrade Your Skills with Industry-Level Learning”🌐</h3>
        <img src="img/nptel logo.jpg">
        <hr>
        <h2>Programming in Java👨🏻‍💻</h2>
        </center>
        <center>
        <form>
            <table>
                <tr>
                    <td>Name :</td> <td><input type="text" placeholder="Enter your name"></td>
                </tr>
                <br>
                <tr>
                    <td>Age :</td> <td><input type="number" placeholder="Enter your age"></td>
                </tr>
                <tr>
                    <td>Email ID :</td> <td><input type="text" placeholder="Enter your email id"></td>
                </tr>
                <tr>
                    <td>Phone Number :</td> <td><input type="number" placeholder="Enter your phone number"></td>
                </tr>
                <tr>
                    <td>College Name :</td> <td><input type="text" placeholder="Enter your college name"></td>
                </tr>
                <tr>
                    <td>Department :</td> <td><input type="text" placeholder="Enter your dept"></td>
                </tr>
                <tr>
                    <td>Year of Study :</td> <td><input type="number" placeholder="Enter your year"></td>
                </tr>
                <tr>
                    <td>Gender :</td>
                    <td>
                        <input type="radio" name="Gender">Male
                        <input type="radio" name="Gender">Female

                    </td>
                </tr>
                <tr>
                    <td>Course Selection :</td>
                    <td>
                        <select>
                            <option>Data Science</option>
                            <option>Web Development</option>
                            <option>Proramming In Java</option>
                            <option>Python</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload photo</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
                <tr>
                    <td>Upload ID Proof</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
                <tr>
                    <td><input type="submit"></td>
                    <td><input type="reset"></td>
                </tr>
            </table>
        </form>
        <hr>
        <center>
        <h3><a href="nptel.html">Home</a></h3>
        </center>
    </body>
</html>
